<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearMic | Pro Audio Enhancer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Two-Color Theme: Zinc 950 (Background) & Cyan 500 (Accent) */
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap');
        
        body { 
            background-color: #09090b; /* Deep Black */
            color: #fafafa; 
            font-family: 'Space Grotesk', sans-serif; 
        }
        .text-cyan { color: #06b6d4; }
        .bg-cyan { background-color: #06b6d4; }
        .border-cyan { border-color: #06b6d4; }
        
        .glass-panel { 
            background: rgba(24, 24, 27, 0.6); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(6, 182, 212, 0.15); 
        }
        
        canvas { 
            width: 100%; 
            height: 120px; 
            background: #09090b; 
            border-radius: 12px;
            border: 1px solid rgba(6, 182, 212, 0.2);
        }
        
        /* Custom Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #06b6d4;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #06b6d4;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-cyan-500/30">

    <main class="w-full max-w-2xl">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold tracking-tighter mb-2">
                Clear<span class="text-cyan">Mic</span>
            </h1>
            <p class="text-zinc-500 text-sm">Real-time Neural Audio Enhancement</p>
        </header>

        <!-- Main Studio Box -->
        <div class="glass-panel rounded-3xl p-6 md:p-10 shadow-2xl shadow-cyan-500/5">
            
            <!-- Upload Area -->
            <div id="uploadArea" class="border-2 border-dashed border-cyan-500/30 rounded-2xl p-12 text-center hover:bg-cyan-500/5 transition cursor-pointer flex flex-col items-center justify-center min-h-[250px]">
                <svg class="w-12 h-12 text-cyan mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <h3 class="text-xl font-bold mb-2">Import Audio File</h3>
                <p class="text-zinc-500 text-sm">Select any recording to clean it instantly.</p>
            </div>
            
            <!-- Input MUST be outside the clickable area -->
            <input type="file" id="audioInput" accept="audio/*,video/mp4" class="hidden">

            <!-- Editor Area (Hidden by default) -->
            <div id="editorArea" class="hidden flex flex-col gap-6">
                
                <!-- Info Bar -->
                <div class="flex justify-between items-center bg-zinc-900/80 px-4 py-3 rounded-xl border border-zinc-800">
                    <span id="fileName" class="text-sm font-bold truncate max-w-[200px] md:max-w-[300px]">recording.mp3</span>
                    <button onclick="resetApp()" class="text-xs text-zinc-500 hover:text-cyan transition">Upload New</button>
                </div>

                <!-- Visualizer -->
                <div class="relative w-full">
                    <canvas id="visualizer"></canvas>
                    <div id="timeDisplay" class="absolute bottom-2 right-3 text-xs font-bold text-cyan bg-zinc-900/80 px-2 py-1 rounded">00:00 / 00:00</div>
                </div>

                <!-- Controls -->
                <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                    
                    <!-- Play Button -->
                    <button id="playBtn" class="w-16 h-16 bg-cyan hover:bg-cyan-400 text-zinc-950 rounded-full flex items-center justify-center transition shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                        <svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                    </button>

                    <!-- Enhancement Toggle -->
                    <div class="flex items-center gap-4 bg-zinc-900/80 px-6 py-4 rounded-2xl border border-zinc-800 w-full md:w-auto">
                        <span class="text-sm font-bold text-zinc-400" id="modeOriginal">Original</span>
                        
                        <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                            <input type="checkbox" name="toggle" id="enhanceToggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-zinc-900 border-4 border-zinc-700 appearance-none cursor-pointer transition-all duration-300 z-10" checked/>
                            <label for="enhanceToggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-zinc-700 cursor-pointer transition-colors duration-300"></label>
                        </div>
                        
                        <span class="text-sm font-bold text-cyan" id="modeCleaned">Cleaned</span>
                    </div>

                </div>

                <div class="text-center mt-4">
                    <p class="text-xs text-zinc-500">Audio is processed locally in real-time. No servers used.</p>
                </div>
            </div>

        </div>
    </main>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const audioInput = document.getElementById('audioInput');
        const editorArea = document.getElementById('editorArea');
        const fileNameDisplay = document.getElementById('fileName');
        const playBtn = document.getElementById('playBtn');
        const enhanceToggle = document.getElementById('enhanceToggle');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const timeDisplay = document.getElementById('timeDisplay');

        // Audio System Variables
        const audioElement = new Audio();
        let audioCtx, source, analyser;
        let highpass, lowpass, compressor;
        let isPlaying = false;
        let animationId;

        // UI Interactions
        uploadArea.addEventListener('click', () => audioInput.click());
        audioInput.addEventListener('change', (e) => {
            if (e.target.files.length) initStudio(e.target.files[0]);
        });

        // Initialize Studio
        function initStudio(file) {
            uploadArea.classList.add('hidden');
            editorArea.classList.remove('hidden');
            fileNameDisplay.innerText = file.name;
            
            // Safe Load via Object URL (No RAM overflow)
            const objectUrl = URL.createObjectURL(file);
            audioElement.src = objectUrl;
            
            // Setup Canvas size
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            // Draw initial flat line
            drawFlatLine();
        }

        // Setup Web Audio API (Must be triggered on user click)
        function setupAudioNodes() {
            if (audioCtx) return; // Already setup

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            source = audioCtx.createMediaElementSource(audioElement);
            analyser = audioCtx.createAnalyser();
            
            // Studio Filters
            highpass = audioCtx.createBiquadFilter();
            highpass.type = 'highpass';
            highpass.frequency.value = 95;

            lowpass = audioCtx.createBiquadFilter();
            lowpass.type = 'lowpass';
            lowpass.frequency.value = 10000;

            compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.value = -24;
            compressor.knee.value = 30;
            compressor.ratio.value = 12;
            compressor.attack.value = 0.003;
            compressor.release.value = 0.25;

            // Analyser settings for visualizer
            analyser.fftSize = 256;

            // Connect routing based on toggle
            routeAudio();
        }

        function routeAudio() {
            if (!audioCtx) return;
            source.disconnect();
            highpass.disconnect();
            lowpass.disconnect();
            compressor.disconnect();
            analyser.disconnect();

            if (enhanceToggle.checked) {
                // Cleaned Mode
                source.connect(highpass);
                highpass.connect(lowpass);
                lowpass.connect(compressor);
                compressor.connect(analyser);
                analyser.connect(audioCtx.destination);
            } else {
                // Original Mode
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
            }
        }

        // Toggle Listener
        enhanceToggle.addEventListener('change', (e) => {
            const modeOriginal = document.getElementById('modeOriginal');
            const modeCleaned = document.getElementById('modeCleaned');
            
            if (e.target.checked) {
                modeCleaned.className = "text-sm font-bold text-cyan";
                modeOriginal.className = "text-sm font-bold text-zinc-600";
            } else {
                modeOriginal.className = "text-sm font-bold text-zinc-100";
                modeCleaned.className = "text-sm font-bold text-zinc-600";
            }
            routeAudio();
        });

        // Play/Pause Controller
        playBtn.addEventListener('click', () => {
            setupAudioNodes();
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isPlaying) {
                audioElement.pause();
                playBtn.innerHTML = '<svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>';
                cancelAnimationFrame(animationId);
            } else {
                audioElement.play();
                playBtn.innerHTML = '<svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>';
                drawVisualizer();
            }
            isPlaying = !isPlaying;
        });

        // Audio Time Updater
        audioElement.addEventListener('timeupdate', () => {
            const current = formatTime(audioElement.currentTime);
            const total = formatTime(audioElement.duration || 0);
            timeDisplay.innerText = `${current} / ${total}`;
        });

        audioElement.addEventListener('ended', () => {
            isPlaying = false;
            playBtn.innerHTML = '<svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>';
            cancelAnimationFrame(animationId);
            drawFlatLine();
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        // Custom Visualizer (Super Light on CPU)
        function drawFlatLine() {
            canvasCtx.fillStyle = '#09090b';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#06b6d4';
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height / 2);
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
        }

        function drawVisualizer() {
            animationId = requestAnimationFrame(drawVisualizer);
            if(!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteTimeDomainData(dataArray);

            canvasCtx.fillStyle = '#09090b';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = enhanceToggle.checked ? '#06b6d4' : '#52525b';
            canvasCtx.beginPath();

            const sliceWidth = canvas.width * 1.0 / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * canvas.height / 2;
                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);
                x += sliceWidth;
            }
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
        }

        function resetApp() {
            audioElement.pause();
            audioElement.src = "";
            editorArea.classList.add('hidden');
            uploadArea.classList.remove('hidden');
            isPlaying = false;
            playBtn.innerHTML = '<svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>';
            if(animationId) cancelAnimationFrame(animationId);
        }
    </script>
</body>
</html>
